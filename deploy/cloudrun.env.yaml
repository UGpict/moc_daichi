# Cloud Run の非秘密環境変数。値は自分のプロジェクトに置き換える。
# 秘密は Secret Manager（ORCAROUTER_API_KEY / GOOGLE_MAPS_API_KEY / WORKER_SHARED_SECRET）。
# サービスアカウント鍵は置かない。

APP_RUNTIME: LIVE
WORKER_MODE: http
FIREBASE_PROJECT_ID: your-firebase-project
NEXT_PUBLIC_FIREBASE_PROJECT_ID: your-firebase-project
NEXT_PUBLIC_FIREBASE_API_KEY: your-web-api-key
NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: your-project.firebaseapp.com
NEXT_PUBLIC_FIREBASE_APP_ID: your-app-id
ORCAROUTER_BASE_URL: https://api.orcarouter.ai/v1
ORCAROUTER_MUNDANE_MODEL: openai/gpt-4o-mini
ORCAROUTER_HARD_MODEL: openai/gpt-4o
NOTIFY_ALLOWLIST: in-app
ENABLE_DEMO_CONTROLS: "false"
